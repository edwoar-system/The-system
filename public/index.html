<!doctype html>
<html lang="en" style="background-color:#01040A">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover fills the whole iPhone screen, including behind the notch and the home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- The colour Safari uses for its own bars, and for the area above and below the page. -->
    <meta name="theme-color" content="#01040A" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>The System</title>
    <style id="expo-reset">
      /* Dark everywhere, so no white shows above, below or when you scroll past the edge. */
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #01040A;
        overscroll-behavior: none;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #01040A;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
