name: Build iPhone app

# Starts a new iPhone build on EAS (needed after native changes, e.g. a new app version).
# Run it from the Actions tab or with: gh workflow run build-ios.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Start build (does not wait for it to finish)
        run: eas build --platform ios --profile preview --non-interactive --no-wait
