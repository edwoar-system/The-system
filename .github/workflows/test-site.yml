name: Test website

# A push to dev updates only the test website (/The-system/test). The real website and the iPhone app
# only change when dev is merged into main ("ship it").
on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the websites (live from main, test from dev)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/dispatches -f event_type=deploy-web
