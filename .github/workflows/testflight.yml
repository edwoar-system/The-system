name: TestFlight build

# Builds the App Store version (production profile) and sends it to TestFlight when it's done.
# Run it from the Actions tab or with: gh workflow run testflight.yml
# Needs these repository secrets: EXPO_TOKEN, ASC_API_KEY (contents of the .p8 file), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: printf '%s\n' "$ASC_API_KEY" > asc_api_key.p8
      - name: Fill in the key ids for EAS Submit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed -i "s/FILL_IN_KEY_ID/$ASC_KEY_ID/; s/FILL_IN_ISSUER_ID/$ASC_ISSUER_ID/" eas.json
      - name: Build and submit to TestFlight (does not wait for it to finish)
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc_api_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
