name: TestFlight build

# Builds the App Store version (production profile) and sends it to TestFlight when it's done.
# Run it from the Actions tab or with: gh workflow run testflight.yml
# Needs these repository secrets: EXPO_TOKEN, ASC_API_KEY (contents of the .p8 file), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.
# The app version for this build is set here (input "version"), not committed first, so over-the-air updates keep
# reaching the installed app until the build is done. After it's on TestFlight, set the same version in app.json.
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version for this build
        default: "1.6.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Check that all secrets are there
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for n in EXPO_TOKEN ASC_API_KEY ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do [ -z "${!n}" ] && missing="$missing $n"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          echo "All secrets are there."
      - run: npm ci
      - name: Version and team for this build
        env:
          VERSION: ${{ inputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.version = process.env.VERSION;
            a.expo.ios.appleTeamId = process.env.APPLE_TEAM_ID;
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2) + "\n");
            console.log("Building version", a.expo.version);
          '
      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: printf '%s\n' "$ASC_API_KEY" > asc_api_key.p8
      - name: Fill in the key ids for EAS Submit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed -i "s/FILL_IN_KEY_ID/$ASC_KEY_ID/; s/FILL_IN_ISSUER_ID/$ASC_ISSUER_ID/" eas.json
      - name: Build and submit to TestFlight (does not wait for it to finish)
        env:
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc_api_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Upload the folder as it is now (with the version set above), not the last commit.
          EAS_NO_VCS: "1"
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
